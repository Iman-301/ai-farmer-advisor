services:
  # ── Postgres + pgvector (KB documents & chunk embeddings, SRS FR08/FR10) ──
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: kb
      POSTGRES_PASSWORD: kb
      POSTGRES_DB: advisor_kb
    ports:
      - "5433:5432"
    volumes:
      - pg_kb_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kb -d advisor_kb"]
      interval: 5s
      timeout: 5s
      retries: 5

  stt_service:
    build: ./stt_service
    ports:
      - "8001:8000"
    environment:
      - WHISPER_MODEL_PATH=/models/asr/whisper-small-amharic-bdu-8khz-aug-ct2-fp16
      - WHISPER_MODEL=small
      - WHISPER_LANGUAGE=am
      - WHISPER_THREADS=8
      - SHARED_UTTERANCES_DIR=/shared/utterances
    volumes:
      - ./data:/data
      - ./models:/models:ro
      - ./vad_service/utterances:/shared/utterances

  logic_service:
    build: ./logic_service
    ports:
      - "8002:8000"
    environment:
      - TTS_URL=http://tts_service:8000/synthesize
      - STT_URL=http://stt_service:8000/transcribe
      - DATA_DIR=/data
      - RAG_DISTANCE_THRESHOLD=1.2
      # KB in Postgres (set to enable; retrieval falls back to Chroma if empty / unset)
      - POSTGRES_URL=postgresql://kb:kb@postgres:5432/advisor_kb
      - RAG_PG_MAX_L2_DISTANCE=1.35
      - HF_HOME=/data/hf_cache              # cache HuggingFace models to volume
      - SENTENCE_TRANSFORMERS_HOME=/data/hf_cache
      - TRANSFORMERS_CACHE=/data/hf_cache
      - HF_HUB_DISABLE_PROGRESS_BARS=1
      # LLM generation on top of RAG context (configure in .env)
      # Using Groq free tier (OpenAI-compatible): https://console.groq.com
      - LLM_PROVIDER=${LLM_PROVIDER:-openai}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.groq.com/openai/v1}
      - OPENAI_MODEL=${OPENAI_MODEL:-llama-3.3-70b-versatile}
      # Gemini config (primary when LLM_PROVIDER=gemini, fallback otherwise)
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.0-flash}
      - LLM_GROQ_FALLBACK_GEMINI=${LLM_GROQ_FALLBACK_GEMINI:-1}
      - LLM_GEMINI_FALLBACK_GROQ=${LLM_GEMINI_FALLBACK_GROQ:-1}
      # TTS: Google gTTS (fast) — sentence streaming in VAD handles perceived latency
      - TTS_MAX_CHARS=${TTS_MAX_CHARS:-400}
      - TTS_TIMEOUT_SECONDS=${TTS_TIMEOUT_SECONDS:-60}
      # Voice: Gemini first for quality; gTTS streaming keeps perceived latency low
      - RAG_VOICE_LLM_FIRST=${RAG_VOICE_LLM_FIRST:-1}
      - RAG_VOICE_COMPOSE_FIRST=${RAG_VOICE_COMPOSE_FIRST:-0}
      - RAG_VOICE_LLM_MAX_TOKENS=${RAG_VOICE_LLM_MAX_TOKENS:-450}
      - RAG_VOICE_PG_FINAL_K=${RAG_VOICE_PG_FINAL_K:-3}
      - RAG_VOICE_RAG_ANSWER_MAX_CHARS=${RAG_VOICE_RAG_ANSWER_MAX_CHARS:-600}
      - RAG_RESPONSE_CACHE_TTL_SEC=${RAG_RESPONSE_CACHE_TTL_SEC:-120}
      # LLM: longer, more expressive Amharic answers (1500 prevents mid-sentence cutoffs)
      - LLM_MAX_TOKENS=${LLM_MAX_TOKENS:-1500}
      # Anti-repetition penalties for Groq/OpenAI compatible chat completions
      - LLM_PRESENCE_PENALTY=${LLM_PRESENCE_PENALTY:-0.6}
      - LLM_FREQUENCY_PENALTY=${LLM_FREQUENCY_PENALTY:-0.5}
      # RAG: pull more candidates and pass more chunks to the LLM for richer answers
      - RAG_PG_CANDIDATE_K=${RAG_PG_CANDIDATE_K:-24}
      - RAG_PG_FINAL_K=${RAG_PG_FINAL_K:-6}
      # Soft guard: if even the best chunk is farther than this, refuse with SRS fallback
      - RAG_MIN_BEST_DISTANCE=${RAG_MIN_BEST_DISTANCE:-1.05}
      # Verbalize numbers in Amharic before TTS (1.5 → አንድ ነጥብ አምስት)
      - TTS_VERBALIZE_NUMBERS=${TTS_VERBALIZE_NUMBERS:-1}
    volumes:
      - ./logic_service:/app
      - ./data:/data
      - ./kb_documents:/app/kb_documents:ro
    depends_on:
      postgres:
        condition: service_healthy
      stt_service:
        condition: service_started
      tts_service:
        condition: service_started

  tts_service:
    build: ./tts_service
    ports:
      - "8003:8000"
    environment:
      - TTS_PROVIDER=${TTS_PROVIDER:-gtts}
      - TTS_LANG=${TTS_LANG:-am}
      - TTS_SAMPLE_RATE=${TTS_SAMPLE_RATE:-16000}
      - TTS_ATEMPO=${TTS_ATEMPO:-1.15}
    volumes:
      - ./data:/data

  # admin_dashboard (old Streamlit UI) removed — replaced by frontend (nginx)

  telephony_service:
    build: ./telephony_service
    environment:
      - STT_URL=http://stt_service:8000/transcribe
      - LOGIC_URL=http://logic_service:8000/ask
      - SAVE_RECORD_URL=http://logic_service:8000/save_call_record
      - TTS_URL=http://tts_service:8000/synthesize
      # SIP_SERVER = registrar / PBX host (SIP_IP alone is often 0.0.0.0 bind and is not a valid peer)
      - SIP_SERVER=${SIP_SERVER:-host.docker.internal}
      - SIP_BIND=${SIP_BIND:-0.0.0.0}
      - SIP_PORT=5060
      - SIP_USER=${SIP_USER:-advisor}
      - SIP_PASS=${SIP_PASS:-changeme}
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    volumes:
      - ./telephony_service:/app
      - ./data:/data
    depends_on:
      - stt_service
      - logic_service
      - tts_service

  # ── Admin Dashboard Frontend (Next.js) ───────────────────────────────────
  admin_dashboard_frontend:
    build: ./admin_dashboard_frontend
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
      # Server-side proxy URL — NOT exposed to browser (no NEXT_PUBLIC_ prefix)
      - LOGIC_SERVICE_URL=http://logic_service:8000
      # Path for the /api/audio streaming route
      - DATA_DIR=/data
    volumes:
      - ./data:/data:ro   # read-only: frontend only streams recordings, never writes
    depends_on:
      - logic_service
    restart: unless-stopped

volumes:
  pg_kb_data:

