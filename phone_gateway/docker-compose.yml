services:
  postgres:
    image: postgres:16
    container_name: phone_gateway_postgres
    environment:
      POSTGRES_DB: phone_gateway_db
      POSTGRES_USER: phone_user
      POSTGRES_PASSWORD: phone_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phone_user -d phone_gateway_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  phone-gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: phone_gateway_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      vad-service:
        condition: service_started
    environment:
      DATABASE_URL: postgresql://phone_user:phone_pass@postgres:5432/phone_gateway_db
      RECORDINGS_DIR: /app/recordings
      VAD_WS_BASE_URL: ws://vad-service:8010/ws/vad
      VAD_UTTERANCES_DIR: /app/utterances
      LOGIC_SERVICE_URL: http://host.docker.internal:8002
      VOICE_ASK_ENABLED: "0"
    ports:
      - "8000:8000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - call_recordings:/app/recordings
      - ../vad_service/utterances:/app/utterances:ro

  pgadmin:
    image: dpage/pgadmin4
    container_name: phone_gateway_pgadmin
    depends_on:
      - postgres
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin123
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin

  vad-service:
    build:
      context: ..
      dockerfile: vad_service/Dockerfile
    container_name: vad_service
    restart: unless-stopped
    ports:
      - "8010:8010"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      ASR_HTTP_URL: http://host.docker.internal:8001/transcribe-file
      RAG_SERVICE_URL: http://host.docker.internal:8002
      TTS_SERVICE_URL: http://host.docker.internal:8003
      VAD_UTTERANCES_DIR: /app/utterances
      MAX_CONCURRENT_ASR: "2"
      VAD_END_SILENCE_MS: "520"
      VAD_TTS_CHUNK_MAX_CHARS: "140"
      VAD_TTS_MAX_CHARS: "400"
      VAD_TTS_MAX_SENTENCES: "4"
    volumes:
      - ../vad_service/utterances:/app/utterances

volumes:
  postgres_data:
  call_recordings:
  pgadmin_data:
